[project]
name = "agent-center"
version = "0.1.0"
description = "AI智能体智能中台"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.141.1",
    "greenlet>=3.5.5",
    "openai>=3.3.1",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.52",
    "tenacity>=9.1.4",
    "uvicorn>=0.52.4",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[[tool.uv.index]]
url = "https://pypi.org/simple"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
